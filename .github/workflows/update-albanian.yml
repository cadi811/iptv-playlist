name: AL XK Master Auto Repair

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: al-xk-master
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python 3.12 installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffprobe installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prüfen und reparieren
        run: python update_albanian.py

      - name: Ergebnis speichern
        run: |
          git config user.name "al-xk-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add albanische_sender.m3u albanische_sender_report.txt

          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Auto: AL/XK Sender aktualisiert"
            git push
          fi
